name: formetas
description: Formetas - Controle financeiro pessoal com filosofia de formiguinha.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  http: ^1.5.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#2F4F3F"
  adaptive_icon_foreground: assets/images/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#2F4F3F"
    theme_color: "#2F4F3F"
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
